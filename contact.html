<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мир кино - Контакты</title>
    <link rel="icon" href="D:/1920x (1).png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-content {
            display: flex;
            gap: 50px;
        }
        
        .contact-form {
            flex: 1;
            background: #1a1a2e;
            padding: 30px;
            border-radius: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 5px;
            background: #0f0f1f;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
        }
        
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .contact-info {
            flex: 1;
        }
        
        .info-box {
            background: #1a1a2e;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .info-box h3 {
            margin-bottom: 15px;
            color: #e50914;
        }
        
        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #0f0f1f;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .social-links a:hover {
            background: #e50914;
            transform: translateY(-3px);
        }
        
        @media (max-width: 992px) {
            .contact-content {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <i class="fas fa-film"></i>Мир Кино
                </a>
                <nav>
                    <ul>
                        <li><a href="index.html">Главная</a></li>
                        <li><a href="movies.html">Фильмы</a></li>
                        <li><a href="about.html">О проекте</a></li>
                        <li><a href="news.html">Новости</a></li>
                        <li><a href="contact.html" class="active">Контакты</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- Contact Section -->
    <section>
        <div class="container">
            <div class="section-title">
                <h2>Связь с нами</h2>
            </div>
            <div class="contact-content">
                <div class="contact-form">
                    <form>
                        <div class="form-group">
                            <label for="name">Ваше имя</label>
                            <input type="text" id="name" placeholder="Введите ваше имя">
                        </div>
                        <div class="form-group">
                            <label for="email">Ваш email</label>
                            <input type="email" id="email" placeholder="Введите ваш email">
                        </div>
                        <div class="form-group">
                            <label for="message">Сообщение</label>
                            <textarea id="message" placeholder="Напишите ваше сообщение"></textarea>
                        </div>
                        <button type="submit" class="btn">Отправить сообщение</button>
                    </form>
                </div>
                <div class="contact-info">
                    <div class="info-box">
                        <h3>Контактная информация</h3>
                        <p><i class="fas fa-phone"></i> +7 (985) 023-89-58</p>
                        <p><i class="fas fa-envelope"></i> efimov.r.g@edu.mirea.ru</p>
                        <p><i class="fas fa-map-marker-alt"></i> Пр. Вернадского, 78</p>
                        
                        <div class="social-links">
                            <a href="https://vk.com/id746927124"><i class="fab fa-vk"></i></a>
                            <a href="#"><i class="fab fa-telegram"></i></a>
                            <a href="#"><i class="fab fa-youtube"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">Мир Кино</div>
                <ul class="footer-links">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="movies.html">Фильмы</a></li>
                    <li><a href="about.html">О проекте</a></li>
                    <li><a href="news.html">Новости</a></li>
                    <li><a href="contact.html">Контакты</a></li>
                </ul>
            </div>
            <div class="copyright">
                <p>&copy; 2025 Мир Кино. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <script>
        // Обработка формы
        const contactForm = document.querySelector('.contact-form form');
        if (contactForm) {
            contactForm.addEventListener('submit', function(e) {
                e.preventDefault();
                alert('Спасибо за ваше сообщение! Мы свяжемся с вами в ближайшее время.');
                this.reset();
            });
        }
    </script>
</body>
</html>
